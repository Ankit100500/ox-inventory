<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Products | OX Connections</title>
  <link rel="stylesheet" href="css/style.css" />
  <script>
  function logout() {
    localStorage.removeItem("token");
    window.location.href = "login.html";
  }

  function loadProducts() {
    fetch("https://ox-inventory-1.onrender.com/api/products", {
      headers: {
        "Authorization": "Bearer " + localStorage.getItem("token")
      }
    })
      .then(res => res.json())
      .then(data => {
        const table = document.getElementById("productTable");
        table.innerHTML = "";

        data.forEach(p => {
          table.innerHTML += `
            <tr>
              <td>${p.name}</td>
              <td>${p.category}</td>
              <td>${p.brand}</td>
              <td>₹${p.price}</td>
              <td>${p.stock}</td>
            </tr>
          `;
        });
        
      });
  }

  function addProduct() {
    const product = {
      name: name.value,
      category: category.value,
      brand: brand.value,
      price: price.value,
      stock: stock.value
    };

    fetch("https://ox-inventory-1.onrender.com/api/products", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + localStorage.getItem("token")
      },
      body: JSON.stringify(product)
    })
    .then(() => {
      loadProducts();
      name.value = category.value = brand.value = price.value = stock.value = "";
    });
  }

  loadProducts();
</script>


</body>
</html>
