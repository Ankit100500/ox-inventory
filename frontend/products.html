<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Products | OX Connections</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/protect.js"></script>
</head>

<body>
  <!-- HEADER -->
  <div style="background:#fff; padding:15px 30px; display:flex; justify-content:space-between;">
    <h2>📦 Products</h2>
    <button onclick="logout()">Logout</button>
  </div>

  <!-- NAV -->
  <div style="margin:20px; background:#fff; padding:15px; border-radius:10px;">
    <a href="dashboard.html">Dashboard</a> |
    <a href="products.html">Products</a> |
    <a href="orders.html">Orders</a> |
    <a href="customers.html">Customers</a> |
    <a href="suppliers.html">Suppliers</a> |
    <a href="reports.html">Reports</a>
  </div>

  <!-- ADD PRODUCT -->
  <div style="margin:20px; background:#fff; padding:20px; border-radius:10px;">
    <h3>Add Product</h3>

    <input id="name" placeholder="Product Name" />
    <input id="category" placeholder="Category" />
    <input id="brand" placeholder="Brand" />
    <input id="price" type="number" placeholder="Price" />
    <input id="stock" type="number" placeholder="Stock" />
    <br><br>
    <button onclick="addProduct()">Add Product</button>
  </div>

  <!-- PRODUCT LIST -->
  <div style="margin:20px; background:#fff; padding:20px; border-radius:10px;">
    <h3>Product List</h3>
    <table border="1" width="100%" cellpadding="10">
      <thead>
        <tr>
          <th>Name</th>
          <th>Category</th>
          <th>Brand</th>
          <th>Price</th>
          <th>Stock</th>
        </tr>
      </thead>
      <tbody id="productTable"></tbody>
    </table>
  </div>

  <script>
    function logout() {
      localStorage.removeItem("token");
      window.location.href = "login.html";
    }

    function loadProducts() {
      fetch("http://localhost:5000/api/products")
        .then(res => res.json())
        .then(data => {
          const table = document.getElementById("productTable");
          table.innerHTML = "";
          data.forEach(p => {
            table.innerHTML += `
              <tr>
                <td>${p.name}</td>
                <td>${p.category}</td>
                <td>${p.brand}</td>
                <td>₹${p.price}</td>
                <td>${p.stock}</td>
              </tr>
            `;
          });
        });
    }

    function addProduct() {
      const product = {
        name: name.value,
        category: category.value,
        brand: brand.value,
        price: price.value,
        stock: stock.value
      };

      fetch("http://localhost:5000/api/products", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(product)
      })
      .then(() => {
        loadProducts();
        name.value = category.value = brand.value = price.value = stock.value = "";
      });
    }

    loadProducts();
  </script>
</body>
</html>
