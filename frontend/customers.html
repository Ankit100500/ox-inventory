<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Customers | OX Connections</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/protect.js"></script>
</head>

<body>
  <!-- HEADER -->
  <div style="background:#fff; padding:15px 30px; display:flex; justify-content:space-between;">
    <h2>👤 Customers</h2>
    <button onclick="logout()">Logout</button>
  </div>

  <!-- NAV -->
  <div style="margin:20px; background:#fff; padding:15px; border-radius:10px;">
    <a href="dashboard.html">Dashboard</a> |
    <a href="products.html">Products</a> |
    <a href="orders.html">Orders</a> |
    <a href="customers.html">Customers</a> |
    <a href="suppliers.html">Suppliers</a> |
    <a href="reports.html">Reports</a>
  </div>

  <!-- ADD CUSTOMER -->
  <div style="margin:20px; background:#fff; padding:20px; border-radius:10px;">
    <h3>Add Customer</h3>

    <input id="companyName" placeholder="Company Name" />
    <input id="contactPerson" placeholder="Contact Person" />
    <input id="email" placeholder="Email" />
    <input id="phone" placeholder="Phone" />
    <input id="city" placeholder="City" />

    <br><br>
    <button onclick="addCustomer()">Add Customer</button>
  </div>

  <!-- CUSTOMER LIST -->
  <div style="margin:20px; background:#fff; padding:20px; border-radius:10px;">
    <h3>Customer List</h3>
    <table border="1" width="100%" cellpadding="10">
      <thead>
        <tr>
          <th>Company</th>
          <th>Contact</th>
          <th>Email</th>
          <th>Phone</th>
          <th>City</th>
        </tr>
      </thead>
      <tbody id="customerTable"></tbody>
    </table>
  </div>

  <script>
    function logout() {
      localStorage.removeItem("token");
      window.location.href = "login.html";
    }

    function loadCustomers() {
      fetch("http://localhost:5000/api/customers")
        .then(res => res.json())
        .then(data => {
          const table = document.getElementById("customerTable");
          table.innerHTML = "";
          data.forEach(c => {
            table.innerHTML += `
              <tr>
                <td>${c.companyName}</td>
                <td>${c.contactPerson}</td>
                <td>${c.email}</td>
                <td>${c.phone}</td>
                <td>${c.city}</td>
              </tr>
            `;
          });
        });
    }

    function addCustomer() {
      const customer = {
        companyName: companyName.value,
        contactPerson: contactPerson.value,
        email: email.value,
        phone: phone.value,
        city: city.value
      };

      fetch("http://localhost:5000/api/customers", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(customer)
      })
      .then(() => {
        loadCustomers();
        companyName.value = contactPerson.value = email.value = phone.value = city.value = "";
      });
    }

    loadCustomers();
  </script>
</body>
</html>
