<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard | OX Connections</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<!-- HEADER -->
<div style="background:#fff; padding:15px 30px; display:flex; justify-content:space-between; align-items:center;">
  <h2 style="margin:0;">🔌 OX Connections - Inventory Management</h2>
  <button onclick="logout()">Logout</button>
</div>

<!-- NAVBAR -->
<div style="margin:20px; background:#fff; padding:15px; border-radius:10px;">
  <a href="dashboard.html">Dashboard</a> |
  <a href="products.html">Products</a> |
  <a href="orders.html">Orders</a> |
  <a href="customers.html">Customers</a> |
  <a href="suppliers.html">Suppliers</a> |
  <a href="reports.html">Reports</a>
</div>

<!-- STATS -->
<div style="margin:20px; background:#fff; padding:20px; border-radius:10px;">
  <h3>Dashboard Overview</h3>

  <div id="stats" style="display:flex; gap:20px; flex-wrap:wrap;">
    <div class="card">Total Products<br><span id="totalProducts">0</span></div>
    <div class="card">Low Stock Items<br><span id="lowStock">0</span></div>
    <div class="card">Pending Orders<br><span id="pendingOrders">0</span></div>
    <div class="card">Completed Orders<br><span id="completedOrders">0</span></div>
  </div>
</div>

<!-- CHARTS -->
<div style="margin:20px; display:flex; gap:20px; flex-wrap:wrap;">
  <div style="width:45%; background:#fff; padding:20px; border-radius:10px;">
    <h4>Orders Status</h4>
    <canvas id="ordersChart"></canvas>
  </div>

  <div style="width:45%; background:#fff; padding:20px; border-radius:10px;">
    <h4>Products Stock</h4>
    <canvas id="productsChart"></canvas>
  </div>
</div>

<script>
const API_BASE = "https://ox-inventory-1.onrender.com";
const token = localStorage.getItem("token");

if (!token) {
  window.location.href = "login.html";
}

function logout() {
  localStorage.removeItem("token");
  window.location.href = "login.html";
}

fetch(`${API_BASE}/api/reports`, {
  headers: {
    "Authorization": "Bearer " + token
  }
})
.then(res => {
  if (!res.ok) throw new Error();
  return res.json();
})
.then(data => {
  document.getElementById("totalProducts").innerText = data.totalProducts;
  document.getElementById("lowStock").innerText = data.lowStockCount;
  document.getElementById("pendingOrders").innerText = data.pendingOrders;
  document.getElementById("completedOrders").innerText = data.completedOrders;

  new Chart(document.getElementById("ordersChart"), {
    type: "pie",
    data: {
      labels: ["Pending", "Completed"],
      datasets: [{
        data: [data.pendingOrders, data.completedOrders],
        backgroundColor: ["#facc15", "#22c55e"]
      }]
    }
  });

  new Chart(document.getElementById("productsChart"), {
    type: "bar",
    data: {
      labels: ["Total Products", "Low Stock"],
      datasets: [{
        label: "Inventory",
        data: [data.totalProducts, data.lowStockCount],
        backgroundColor: ["#6366f1", "#ef4444"]
      }]
    }
  });
})
.catch(() => {
  alert("Failed to load dashboard");
});
</script>

</body>
</html>
